<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Lignée de Valbrume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dde1e4; --surface:#f1f2f0; --surface2:#e5e8ea; --ink:#1c2128; --muted:#59626c; --line:#b7bfc6;
  --accent:#9a6b06; --on-accent:#fff; --hp:#c0392b; --hero:#2f8f4e; --xp:#2c6fd1; --track:#cfd5da;
  --map:#c9d4bf; --path:#8d8670; --good:#2f8f4e; --bad:#c0392b; --warn:#b26a00;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161c; --surface:#1c222a; --surface2:#242b35; --ink:#ebe6d9; --muted:#9aa3ad; --line:#333c48;
    --accent:#e2a93b; --on-accent:#1a1308; --hp:#e2584a; --hero:#4cbf72; --xp:#5c9df2; --track:#2b333e;
    --map:#1d2a22; --path:#7d7458; --good:#5fd08a; --bad:#ef6b5c; --warn:#e8a03a; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1c222a; --surface2:#242b35; --ink:#ebe6d9; --muted:#9aa3ad; --line:#333c48;
  --accent:#e2a93b; --on-accent:#1a1308; --hp:#e2584a; --hero:#4cbf72; --xp:#5c9df2; --track:#2b333e;
  --map:#1d2a22; --path:#7d7458; --good:#5fd08a; --bad:#ef6b5c; --warn:#e8a03a; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Alegreya",Georgia,"Times New Roman",serif;font-size:17px;line-height:1.45;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
h1,h2,h3,.sc{font-family:"Alegreya SC","Alegreya",Georgia,serif;font-weight:700;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.node:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.px{display:block;flex:none}
.wrap{max-width:540px;margin:0 auto;width:100%;padding:0 14px}
.muted{color:var(--muted)} .pos{color:var(--good)} .neg{color:var(--bad)} .warn{color:var(--warn)}

.top{padding:8px 0}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.who{display:flex;gap:8px;align-items:center;min-width:0}
.top h1{font-size:1.15rem;line-height:1.15}
.sub{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res{display:flex;gap:10px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tab{display:none;padding:4px 0 24px}
.tab.active{display:block}
h2{font-size:1.15rem;margin:18px 0 8px}

.goal{display:block;width:100%;text-align:left;border:1px solid var(--accent);border-radius:12px;background:var(--surface);padding:9px 12px;margin-bottom:10px;font-size:.95rem}
.goal b{font-family:"Alegreya SC",Georgia,serif;color:var(--accent)}

.mapbox{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  background:radial-gradient(ellipse at 20% 85%,rgba(120,160,80,.35),transparent 55%),radial-gradient(ellipse at 85% 20%,rgba(140,70,40,.3),transparent 50%),var(--map)}
#map{display:block;width:100%;height:auto}
#map .path{stroke:var(--path);stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round}
#map .path.route{stroke:var(--accent);stroke-width:4;stroke-dasharray:none;opacity:.85}
#map .node{cursor:pointer}
#map .node .ring{fill:rgba(255,255,255,.08);stroke:transparent;stroke-width:3}
#map .node.cur .ring{stroke:var(--accent);fill:rgba(226,169,59,.18)}
#map .node.sel .ring{stroke:var(--ink);stroke-dasharray:4 3}
#map .nl{font-family:"Alegreya SC",Georgia,serif;font-size:12px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--map);stroke-width:4px}
#map .mk{font-size:14px}
#map .qd{fill:var(--accent);stroke:var(--map);stroke-width:2}
#map .qt{font-family:"Alegreya SC",Georgia,serif;font-size:11px;font-weight:800;fill:var(--on-accent)}
.tbar{display:flex;gap:10px;align-items:center;border:1px solid var(--ink);border-radius:12px;background:var(--surface);padding:8px 10px;margin-top:8px}
.tbar[hidden]{display:none}
.tbar .tt{flex:1;font-size:.92rem;line-height:1.25}

.strip{display:flex;gap:8px;margin:10px 0;overflow-x:auto}
.chip{flex:1;min-width:104px;display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:5px 7px;font-size:.8rem}
.chip .cn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.loc{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px}
.loc-h{display:flex;gap:12px;align-items:center}
.loc-h h2{margin:0;font-size:1.3rem}
.loc p{margin:8px 0 12px;color:var(--muted)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .wide{grid-column:1/-1}
.npcs{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.npc{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:6px 10px}
.npc .nm{font-weight:700;line-height:1.2}
.npc .sb{font-size:.8rem;color:var(--muted)}
.npc .q{margin-left:auto;font-family:"Alegreya SC",Georgia,serif;font-size:.8rem;font-weight:800;color:var(--accent);white-space:nowrap}
.champ{display:flex;gap:10px;align-items:center;border:1px dashed var(--warn);border-radius:12px;padding:6px 10px;margin-top:8px}
.champ .grow{flex:1;min-width:0}
.trait{display:inline-block;font-size:.72rem;border-radius:6px;padding:1px 7px;margin:5px 4px 0 0;background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);font-weight:700}
.trait.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.trait.rare{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.bld{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px;margin-bottom:8px}
.bld .ic{font-size:26px;line-height:1.2}
.bld .grow{flex:1;min-width:0}
.stars{color:var(--accent);letter-spacing:2px}
.panel textarea{width:100%;min-height:110px;font:inherit;font-size:.78rem;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);word-break:break-all}
.champ.legend{border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.champ .nm{font-weight:700}
.champ .sb{font-size:.8rem;color:var(--muted)}

.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hero);transition:width .2s}
.bar.en i{background:var(--hp)} .bar.xp i{background:var(--xp)} .bar.gold i{background:var(--accent)}

.btn{position:relative;font-family:"Alegreya SC",Georgia,serif;font-weight:700;font-size:1rem;padding:11px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);min-height:46px;line-height:1.2}
.btn:disabled{opacity:.42;cursor:default}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.small{min-height:38px;padding:7px 10px;font-size:.9rem}
.btn small{font-family:"Alegreya",Georgia,serif;font-weight:400;font-size:.8rem}

.card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px;margin-bottom:10px}
.card-h{display:flex;gap:12px;align-items:center}
.card-h .nm{font-weight:700;font-size:1.05rem;line-height:1.2}
.card-h .sb{font-size:.85rem;color:var(--muted)}
.stats-line{display:flex;gap:14px;font-size:.88rem;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.pc{font-size:.85rem;margin-top:6px}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btns .btn{flex:1}
.tagline{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;color:var(--muted);vertical-align:middle;font-weight:400}

.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.steps li .m{width:22px;text-align:center;flex:none}
.steps li.done{color:var(--muted);text-decoration:line-through}
.steps li.cur{font-weight:700}
.steps li.fut{color:var(--muted)}
.story p{margin:.5em 0}
.hist{list-style:none;padding:0;margin:0}
.hist li{padding:6px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.trophies{display:flex;flex-wrap:wrap;gap:8px}
.trophy{width:54px;text-align:center;font-size:.65rem;line-height:1.1;color:var(--muted)}
.trophy .px{margin:0 auto 2px}
.trophy.no .px{filter:brightness(0);opacity:.25}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface)}
.tabs button{background:none;border:0;padding:8px 2px 10px;font-family:"Alegreya SC",Georgia,serif;font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;position:relative}
.tabs button span{font-size:1.35rem;line-height:1.2}
.tabs button.active{color:var(--ink)}
.tabs button.active::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* Combat */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:15;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.overlay[hidden]{display:none}
.cb{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.cb .wrap{flex:1;display:flex;flex-direction:column;padding-top:10px;padding-bottom:12px}
.cb-top{text-align:center;color:var(--muted);font-size:.9rem;font-family:"Alegreya SC",Georgia,serif}
.scene{position:relative;border-radius:16px;border:1px solid var(--line);padding:14px 6px 12px;margin:6px 0;overflow:hidden}
.scene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 8px,transparent 8px 16px);pointer-events:none}
.enemies{position:relative;z-index:1;display:flex;gap:4px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.en{position:relative;flex:1 1 0;min-width:90px;max-width:160px;text-align:center;border:0;background:none;padding:4px 2px}
.en .px{margin:0 auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.en .lab{display:inline-block;margin-top:4px;background:var(--surface);border:2px solid transparent;border-radius:8px;padding:2px 6px;max-width:100%}
.en.sel .lab{border-color:var(--accent)}
.en.ko{opacity:.25}
.en .enn{font-weight:700;font-size:.82rem;line-height:1.15}
.en .tg{font-size:.68rem;color:var(--warn);line-height:1.2}
.en .bar{margin-top:3px;height:6px}
.cb-log{list-style:none;margin:6px 0;padding:0;font-size:.88rem;color:var(--muted);min-height:84px}
.cb-log li:first-child{color:var(--ink)}
.allies{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.al{position:relative;display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:5px 10px}
.al.ko{opacity:.4}
.al .aln{font-weight:700;font-size:.92rem;display:flex;justify-content:space-between;gap:6px}
.al .st{font-weight:400;font-size:.78rem;color:var(--muted)}
.hp-txt{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cb-acts{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:8px}
.cb-skills{display:grid;gap:6px;margin-top:8px}
.skb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 3px;border-radius:12px;border:1px solid var(--accent);background:var(--surface);color:var(--ink);min-height:58px;line-height:1.1;font-family:"Alegreya SC",Georgia,serif;font-weight:700;font-size:.74rem;text-align:center}
.skb .ic{font-size:1.35rem;line-height:1}
.skb .cd{position:absolute;top:3px;right:5px;font-size:.72rem;color:var(--muted);font-family:"Alegreya",Georgia,serif}
.skb:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.sks{margin-top:8px}
.sks .sk{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line);font-size:.92rem;line-height:1.25}
.sks .sk .ic{font-size:1.3rem;width:28px;text-align:center;flex:none}
.sks .sk.lock{opacity:.55}
.en .est{font-size:.68rem;color:var(--xp);font-weight:700;line-height:1.2}
.tip{border-radius:10px;background:color-mix(in srgb,var(--xp) 12%,transparent);padding:7px 10px;margin-top:10px;font-size:.92rem}
.newsk{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.newsk .ic{font-size:2.4rem;line-height:1}
.carnet{list-style:none;padding:0;margin:8px 0 0}
.carnet li{padding:7px 0;border-top:1px solid var(--line);line-height:1.3}
.carnet .cd{display:block;font-size:.78rem;color:var(--muted)}
.bondl{font-size:.82rem;color:var(--muted);margin-top:6px}
.bar.bond i{background:#d6578a}
.btn.pick{text-align:left;font-family:"Alegreya",Georgia,serif;font-weight:400;padding:10px 12px;background:var(--bg)}
.btn.pick .nm{font-family:"Alegreya SC",Georgia,serif;font-weight:700;font-size:1.08rem}
.btn.pick .jb{color:var(--muted);font-size:.85rem}
.btn.pick .tl{display:block;font-size:.88rem;margin-top:3px;line-height:1.3}
.auto{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;color:var(--muted);font-size:.9rem}
.auto input{width:20px;height:20px;accent-color:var(--accent)}
.fl{position:absolute;left:50%;top:22%;font-family:"Alegreya SC",Georgia,serif;font-weight:800;font-size:1.35rem;pointer-events:none;animation:up .9s ease-out forwards;white-space:nowrap;color:#fff;text-shadow:0 2px 0 #000,0 0 4px #000;z-index:3}
.fl.d{color:#ff8a7a} .fl.h{color:#7dffa6} .fl.s{color:#ffd84a;font-size:1.7rem}
@keyframes up{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-38px)}}
.hit{animation:hit .3s}
@keyframes hit{20%{transform:translateX(-5px)}50%{transform:translateX(5px);filter:brightness(2)}80%{transform:translateX(-3px)}}
.lunge{animation:lunge .3s}
@keyframes lunge{50%{transform:translateY(10px) scale(1.08)}}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:25}
.sheet[hidden]{display:none}
.panel{background:var(--surface);width:100%;max-width:540px;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow-y:auto;animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(30px);opacity:.6}}
.panel h3{font-size:1.3rem;margin-bottom:6px}
.panel .mbtns{display:grid;gap:8px;margin-top:16px}
.panel input[type=text]{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:4px 0 10px}
.panel label.f{font-weight:700;font-size:.9rem}
.cls-opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:8px 10px;margin-bottom:8px}
.cls-opt.on{border-color:var(--accent)}
.cls-opt .nm{font-weight:700}
.cls-opt .rl{font-size:.8rem;color:var(--muted);margin-left:6px}
.cls-opt .pc{margin-top:2px}
.foe{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.foe .tg{font-size:.8rem;color:var(--warn)}
.diff{font-family:"Alegreya SC",Georgia,serif;font-size:1.1rem;margin-top:10px}
.dlg{border-left:3px solid var(--accent);padding-left:10px;font-style:italic}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip-b{border:2px solid var(--line);background:var(--bg);border-radius:20px;padding:6px 14px;font-weight:700;color:var(--ink)}
.chip-b.on{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.duel{display:flex;align-items:center;gap:6px;margin:10px 0}
.duelist{position:relative;flex:1;min-width:0;text-align:center;border:1px solid var(--line);border-radius:12px;padding:8px 4px;background:var(--bg)}
.duelist .px{margin:0 auto}
.duelist .nm{font-weight:700;line-height:1.2}
.duelist .sb{font-size:.78rem;color:var(--muted)}
.duelist .tg{font-size:.75rem;color:var(--warn)}
.duelist .stats-line{gap:8px;font-size:.8rem;margin:4px 0}
.odds{font-family:"Alegreya SC",Georgia,serif;font-weight:800;color:var(--accent);margin-top:2px}
.vs{font-family:"Alegreya SC",Georgia,serif;font-weight:800;color:var(--muted)}
.center .px{margin:6px auto}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-weight:600;font-size:.95rem;z-index:40;max-width:90vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.panel,.hit,.lunge{animation:none}.fl{animation-duration:.01s}.bar i{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="top-row">
    <div class="who"><span id="hero-px"></span><div style="min-width:0"><h1 id="fam">Lignée</h1><div class="sub" id="gen"></div></div></div>
    <div class="res"><span title="Or">🪙 <b id="gold">0</b></span><span title="Potions">🧪 <b id="pots">0</b></span><span title="Jour">☀️ <b id="day">1</b></span></div>
  </div>
</div></header>

<main><div class="wrap">
  <section class="tab active" id="tab-world">
    <button class="goal" id="goal"></button>
    <div class="mapbox"><svg id="map" viewBox="0 0 360 300" role="group" aria-label="Carte du monde"></svg></div>
    <div class="tbar" id="tbar" hidden></div>
    <div class="strip" id="strip"></div>
    <div class="loc" id="loc"></div>
  </section>
  <section class="tab" id="tab-family"><div id="family"></div></section>
  <section class="tab" id="tab-journal"><div id="journal"></div></section>
</div></main>

<nav class="tabs" aria-label="Navigation">
  <button data-tab="world" class="active"><span>🗺️</span>Monde</button>
  <button data-tab="family"><span>👪</span>Famille</button>
  <button data-tab="journal"><span>📜</span>Journal</button>
</nav>

<div class="overlay" id="combat" hidden>
  <div class="cb"><div class="wrap">
    <div class="cb-top" id="cb-top"></div>
    <div class="scene" id="scene"><div class="enemies" id="cb-en"></div></div>
    <ul class="cb-log" id="cb-log"></ul>
    <div class="allies" id="cb-al"></div>
    <div class="cb-skills" id="cb-skills"></div>
    <div class="cb-acts">
      <button class="btn primary" id="a-atk">⚔️ Attaquer</button>
      <button class="btn" id="a-pot" aria-label="Boire une potion">🧪</button>
      <button class="btn" id="a-flee">🏃 Fuir</button>
    </div>
    <label class="auto"><input type="checkbox" id="a-auto"> Combat automatique</label>
  </div></div>
</div>

<div class="sheet" id="modal" hidden><div class="panel" id="mpanel"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ===== Illustrations vectorielles ===== */
const OL="#2a2230";
const S=`stroke="${OL}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"`;
function sh(hex,a){let h=hex.replace("#","");if(h.length===3)h=h.split("").map(x=>x+x).join("");
  const n=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)).map(v=>Math.round(a<0?v*(1+a):v+(255-v)*a));

function passDays(n){
  for(let i=0;i<n;i++){
    G.day++;
    for(const c of Object.values(G.chars)){
      if(!isFam(c)||c.age===undefined)continue;
      c.age+=.5*(hasT(c,"longevif")?.5:1)*(hasT(c,"frileux")?1.4:1);
      const risk=c.age>=72?.12:c.age>=65?.04:0;
      if(risk&&Math.random()<risk&&!G.pending.includes(c.id))G.pending.push(c.id);
    }
    for(const k of kids())if(!k.cls&&k.grow<100){if(k.rev===undefined){k.grow=Math.min(100,k.grow+GROW);if(k.grow>=100)toast(`${k.name} est en âge de choisir sa voie.`);}else growKid(k,GROW);}
    for(const m of mercs())if(m.until&&G.day>=m.until){G.party=G.party.filter(x=>x!==m.id);delete G.chars[m.id];toast(`⏳ ${m.name} a fini son contrat et reprend la route.`);}
    const mine=kids().filter(k=>k.parent===G.heroId);
    if(G.married&&G.expecting&&G.day>=G.expecting){G.expecting=0;birth(false);}
    else if(G.married&&!G.expecting&&mine.length<MAX_KIDS&&hero()&&(hero().age||25)<50&&Math.random()<.008){G.expecting=G.day+3;toast("💛 Une heureuse surprise : un enfant est en route !");}
  }
}

  const used=new Set(Object.values(G.chars).map(c=>c.name));
  const g=Math.random()<.5?"m":"f",name=freshName(g);
  const k=newChar(name,null,"child");k.g=g;k.grow=0;k.rev=0;k.parent=G.heroId;G.chars[k.id]=k;
  if(adopt){k.adopted=true;k.traits=inheritTraits([pick(Object.keys(TRAITS).filter(t=>!TRAITS[t].rare))],[]);}
  else{k.traits=inheritTraits(hero().traits,G.partner&&G.partner.traits);
    if((G.flags.boss_ignarath||G.flags.boss_ignara||G.choices.dragon==="pact")&&k.traits.length<2)k.traits.push("cendre");}
  const h=hero();if(adopt){mem(k,`Recueilli${ef(k)} au temple de Valbrume par ${h.name}.`);mem(h,`Recueille ${name} au temple.`);growKid(k,40,true);}
  else{mem(k,`Naît au foyer ${deN(h.name)}${G.partner?` et ${G.partner.name}`:""}.`);mem(h,`Naissance ${deN(name)}.`);}
  G.tries=0;toast(adopt?`🏠 ${name} rejoint la famille.`:`👶 ${name} vient de naître !`);return k;

function birthChance(){const a=hero().age||25;if(a>=50)return 0;let p=.2+.1*(G.tries||0);if(a>=35)p-=.05;if(a>=40)p-=.08;if(bld("temple"))p+=.05;return Math.max(.05,Math.min(.6,p));}
const chanceTxt=p=>p===0?"Il est désormais trop tard pour avoir des enfants.":p<.3?"Les chances semblent minces…":p<.55?"Rien n’est joué.":"Les chances semblent bonnes.";
async function foyer(){
  const mk=myKids(),p=birthChance(),full=mk.length>=MAX_KIDS;
  const canAdopt=!full&&!G.expecting&&((G.tries||0)>=3||(hero().age||0)>=45);
  const status=G.expecting?"Un enfant est en route : il naîtra dans quelques jours.":full?"Le foyer est complet : deux enfants, c’est déjà beaucoup par les temps qui courent.":chanceTxt(p);
  const v=await modal(`<h3>🏠 Le foyer</h3><p>${esc(hero().name)} et ${esc(G.partner?G.partner.name:"ton conjoint")} · enfants : ${mk.length} sur ${MAX_KIDS}</p><p class="muted">${status}</p>${(G.tries||0)&&!full?`<p class="hp-txt">Essais sans succès : ${G.tries}. Chaque échec rend le prochain essai plus prometteur.${canAdopt?" Le temple propose aussi de recueillir un orphelin.":""}</p>`:""}`,
    [{l:`💞 Essayer d’avoir un enfant<br><small>${G.nextTry>G.day?`Patience : réessayer dans ${G.nextTry-G.day} jour${G.nextTry-G.day>1?"s":""}`:"1 jour"}</small>`,cls:"primary",v:"try",dis:full||!!G.expecting||p===0||G.nextTry>G.day},
     ...(canAdopt?[{l:"🤝 Recueillir un orphelin",v:"adopt"}]:[]),
     {l:"Voir la famille",v:"fam"},{l:"Fermer",v:null}]);
  if(v==="fam")return showTab("family");
  if(v==="try"){
    passDays(1);
    if(G.expecting){}
    else if(Math.random()<p){G.expecting=G.day+3;save();await story("Une heureuse nouvelle",["Quelques semaines plus tard, la nouvelle tombe : un enfant est en route. Il naîtra dans quelques jours."]);}
    else{G.tries=(G.tries||0)+1;G.nextTry=G.day+3;save();await story("Pas cette fois",["La nature n’a pas voulu, cette fois. Il faudra laisser passer quelques jours avant de réessayer."]);}
    renderAll();checkProgress();
  }
  if(v==="adopt"){const k=birth(true);addHonor(1);save();await story("Un nouveau membre",[`Le temple de Valbrume abrite des orphelins de la guerre. ${k.name} vous regarde avec de grands yeux : désormais, c’est ici chez lui.`]);renderAll();checkProgress();}
}

let toastT;
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2400);}
function modal(html,buttons=[],opts={}){
  return new Promise(res=>{
    const p=$("#mpanel");
    p.innerHTML=html+(buttons.length?`<div class="mbtns">${buttons.map((b,i)=>`<button class="btn ${b.cls||""}" data-mb="${i}" ${b.dis?"disabled":""}>${b.l}</button>`).join("")}</div>`:"");
    $("#modal").hidden=false;p.scrollTop=0;
    p.onclick=e=>{const b=e.target.closest("[data-mb]");if(!b)return;const btn=buttons[+b.dataset.mb];$("#modal").hidden=true;p.onclick=null;res(btn.v!==undefined?btn.v:true);};
    $("#modal").onclick=e=>{if(e.target.id==="modal"&&opts.dismiss!==false&&buttons.length<=1){$("#modal").hidden=true;res(null);}};
    if(opts.after)opts.after(p,res);
  });
}
function story(title,paras){return modal(`<h3>${esc(title)}</h3><div class="story">${paras.map(p=>`<p>${esc(fill(p))}</p>`).join("")}</div>`,[{l:"Continuer",cls:"primary"}],{dismiss:false});}

function chooseClass(title,intro,costFn){

    $("#mpanel").innerHTML=`<h3>${esc(title)}</h3>${intro?`<p class="muted">${intro}</p>`:""}${clsOptions(costFn)}<div class="mbtns"><button class="btn primary" id="cc-ok" disabled>Choisir</button>${costFn?'<button class="btn" id="cc-no">Annuler</button>':""}</div>`;
    $("#modal").hidden=false;$("#modal").onclick=null;

function foes(pool,n,mod={},target){
  if(target===undefined)target=pickTarget();
  const H=hero().lvl,party=partyChars().map(c=>({...c,hp:charStats(c).hp}));
  const L=Math.max(1,H+(target>.9?-1:target>.6?0:target>.3?1:2));
  const tpls=Array.from({length:n},()=>pick(pool));
  const build=(k,m)=>tpls.slice(0,m).map((t,i)=>{const e=makeEnemy(t,Math.max(1,L-(m>2&&i===m-1?1:0)),mod);e.hp=Math.max(4,Math.round(e.hp*Math.pow(k,0.4)));e.atk=Math.max(1,Math.round(e.atk*Math.pow(k,1)));e.def=Math.round(e.def*Math.pow(k,.3));return e;});

    case"gel":{aoe(.7);const fr=foes.filter(e=>e.hp>0&&!e.big);fr.forEach(e=>e.stun=1);if(fr.length)S.fx.log(fr.length>1?`${fr.length} ennemis sont gelés pour un tour.`:`${fr[0].n} est gelé pour un tour.`);break;}
    case"provoc":a.taunt=2;S.fx.log(`${a.n} provoque les ennemis et lève son bouclier.`);break;
    case"bouclier":strike(S,a,t,1.2,{sk:k.n,bonus:a.def});if(t&&t.hp>0&&!t.big){t.stun=1;S.fx.log(`${t.n} est étourdi.`);}break;
    case"rempart":S.wall=2;S.fx.log(`${a.n} dresse un rempart : le groupe encaisse moitié moins.`);break;
    case"riposte":a.riposte=2;S.fx.log(`${a.n} se met en garde : chaque coup reçu sera rendu.`);break;
    case"soin":for(const x of pals){const v=Math.max(8,Math.round(x.max*.3));x.hp=Math.min(x.max,x.hp+v);S.fx.heal(x,v);}S.fx.log(`${a.n} soigne le groupe.`);break;
    case"lumiere":{const d=strike(S,a,t,1.8,{sk:k.n});const v=Math.round(d*.3);if(v>0&&a.hp>0){a.hp=Math.min(a.max,a.hp+v);S.fx.heal(a,v);}break;}
    case"relever":{const down=S.allies.find(x=>x.hp<=0);
      if(down){down.hp=Math.round(down.max*.5);S.fx.heal(down,down.hp);S.fx.log(`${down.n} se relève !`);}
      else{const x=pals.sort((p,q)=>p.hp/p.max-q.hp/q.max)[0];const v=Math.round(x.max*.3);x.hp=Math.min(x.max,x.hp+v);S.fx.heal(x,v);S.fx.log(`${a.n} soigne ${x.n} : +${v} PV.`);}break;}
    case"benediction":for(const x of pals)x.bless=3;S.fx.log(`${a.n} bénit le groupe : +30 % de dégâts pendant 3 tours.`);break;
  }
}
function aiPick(S,a){
  const f=alive(S.enemies),p=alive(S.allies),T=bestTarget(S,a),low=r=>p.some(x=>x.hp<x.max*r);
  if(a.cls==="clerc"){
    if(ready(a,"relever")&&(S.allies.some(x=>x.hp<=0)||low(.3)))return["relever"];
    if(ready(a,"soin")&&low(.55))return["soin"];
    if(ready(a,"benediction")&&!p.some(x=>x.bless>0)&&f.reduce((n,e)=>n+e.hp,0)>a.atk*4)return["benediction"];
    if(ready(a,"lumiere"))return["lumiere",T];
  }else if(a.cls==="gardien"){
    if(ready(a,"rempart")&&!S.wall&&(p.length>1&&low(.7)||f.some(e=>e.boss)))return["rempart"];
    if(ready(a,"provoc")&&!p.some(x=>x.taunt>0)&&(p.length>1||a.hp<a.max*.8))return["provoc"];
    if(ready(a,"riposte")&&!a.riposte)return["riposte"];
    if(ready(a,"bouclier")){const st=f.filter(e=>!e.big&&!e.stun).sort((x,y)=>y.atk-x.atk)[0];return["bouclier",st||T];}
  }else if(a.cls==="guerrier"){
    if(ready(a,"brise")&&!T.broken&&(T.tags.includes("phys")||T.big)&&T.hp>a.atk*2)return["brise",T];
    if(ready(a,"tourbillon")&&f.length>=2)return["tourbillon"];
    if(ready(a,"frappe"))return["frappe",T];
  }else if(a.cls==="mage"){
    if(ready(a,"gel")&&f.filter(e=>!e.big).length>=2)return["gel"];
    if(ready(a,"feu")&&f.length>=2)return["feu"];
    if(ready(a,"eclair"))return["eclair",T];
    if(ready(a,"feu"))return["feu"];
  }
  return["atk",T];
}
function act(S,a,[id,t]){S.fx.act(a);if(id==="atk")strike(S,a,t,1);else doSkill(S,a,id,t);}
function foeAct(S,e){
  const al=alive(S.allies);if(!al.length||e.hp<=0)return;
  let t=al.find(a=>a.taunt>0);if(!t){const pool=[];for(const a of al){pool.push(a);if(a.cls==="gardien")pool.push(a);}t=pick(pool);}
  const d=Math.max(1,Math.round((e.atk-t.def*.5)*rnd(.9,1.1)*(t.taunt>0?.6:1)*(S.wall>0?.5:1)));
  t.hp=Math.max(0,t.hp-d);S.fx.foeHit(e,t,d);if(t.hero&&t.hp<=0)S.killer=e;
  if(t.riposte>0&&e.hp>0){const r=Math.max(1,Math.round(d*.7));e.hp=Math.max(0,e.hp-r);S.fx.riposte(t,e,r);}
}
const foeHits=e=>e.tags.includes("double")?2:1;
function endRound(S){for(const a of S.allies){for(const k in a.cds)if(a.cds[k]>0)a.cds[k]--;if(a.taunt>0)a.taunt--;if(a.riposte>0)a.riposte--;if(a.bless>0)a.bless--;}if(S.wall>0)S.wall--;}
const outcome=S=>S.enemies.every(e=>e.hp<=0)?"win":S.allies.every(a=>a.hp<=0)?"lose":null;
function simBattle(en,party,plain){
  const S={fx:FX0,wall:0,allies:(party||partyChars()).map(mkAlly),enemies:en.map(mkFoe)};
  for(let r=0;r<80;r++){
    for(const a of S.allies){if(outcome(S))break;if(a.hp>0)act(S,a,plain&&a.hero?["atk",bestTarget(S,a)]:aiPick(S,a));}
    for(const e of S.enemies){if(outcome(S))break;if(e.hp<=0)continue;if(e.stun>0){e.stun--;continue;}for(let k=0;k<foeHits(e);k++)foeAct(S,e);}
    const o=outcome(S);if(o)return o==="win";endRound(S);
  }
  return false;
}
function winRate(en,n=250){let w=0;for(let i=0;i<n;i++)if(simBattle(en))w++;return w/n;}
function difficulty(en){
  let w=0;for(let i=0;i<300;i++)if(simBattle(en,null,i%2))w++;const p=w/300;
  return p>=.9?["Facile","pos",p]:p>=.6?["Équilibré","",p]:p>=.3?["Difficile","warn",p]:["Mortel","neg",p];
}

function advice(en){
  const sc=t=>{let w=0,v=0;for(const e of en){w+=e.hp;v+=e.hp*resMult(e.tags,t);}return v/w;};
  const S={phys:sc("phys"),magie:sc("magie"),lumiere:sc("lumiere")};
  const best=Object.keys(S).sort((a,b)=>S[b]-S[a])[0],h=hero(),hT=CLASSES[h.cls].dmg;
  if(S[best]-S[hT]<.2)return S[hT]>1.15?`<div class="tip">💡 Ces ennemis craignent la lumière : ta foi fera merveille.</div>`:"";
  const mate=partyChars().find(c=>c!==h&&CLASSES[c.cls].dmg===best);
  if(mate)return `<div class="tip">💡 Tes coups porteront moins ici, mais ${esc(mate.name)} (${CLASSES[mate.cls].n.toLowerCase()}) sera efficace.</div>`;
  const w=TYPE_WHO[best];return `<div class="tip">💡 ${w.charAt(0).toUpperCase()+w.slice(1)} serait plus efficace ici.</div>`;
}

function tuneTeam(en,target){
  const base=en.map(e=>({hp:e.hp,atk:e.atk}));let lo=Math.log(.3),hi=Math.log(6);
  const apply=k=>{k=Math.exp(k);en.forEach((e,i)=>{e.hp=Math.max(6,Math.round(base[i].hp*k));e.atk=Math.max(2,Math.round(base[i].atk*Math.sqrt(k)));});};
  for(let it=0;it<8;it++){const k=(lo+hi)/2;apply(k);if(winRate(en,120)>target)lo=k;else hi=k;}
  apply((lo+hi)/2);return en;
}

}

function duelist(L){const tpl=pick(DUEL_FOES);const e=makeEnemy(tpl,Math.max(1,L+ri(-1,1)),{n:pick(GLAD_NAMES),hp:1.8});e.kind=EN[tpl].n;e.dmg=tpl==="pyromancien"?"magie":"phys";return e;}
function duelHit(a,b){return Math.max(1,Math.round((a.atk*resMult(b.tags,a.dmg)-b.def*.5)*rnd(.7,1.3)));}
function simDuel(a,b){let ha=a.hp,hb=b.hp,t=Math.random()<.5;while(ha>0&&hb>0){if(t)hb-=duelHit(a,b);else ha-=duelHit(b,a);t=!t;}return hb<=0;}
function winProb(a,b){let w=0;for(let i=0;i<600;i++)if(simDuel(a,b))w++;return Math.min(.94,Math.max(.06,w/600));}
const oddsFor=p=>Math.max(1.1,Math.min(8,.9/p));
function duelPair(L){
  const a=duelist(L);let b=duelist(L);while(b.n===a.n)b.n=pick(GLAD_NAMES);
  const target=Math.random()<.15?rnd(.13,.22):rnd(.36,.6);
  const hb=b.hp,ab=b.atk,apply=k=>{b.hp=Math.max(10,Math.round(hb*k));b.atk=Math.max(3,Math.round(ab*Math.sqrt(k)));};
  let lo=.3,hi=3;for(let i=0;i<8;i++){const k=(lo+hi)/2;apply(k);if(1-winProb(a,b)<target)lo=k;else hi=k;}
  apply((lo+hi)/2);return Math.random()<.5?[a,b]:[b,a];
}

  }

  if(b.dataset.j==="famname"){const n=await askName(G.family.name,"Renommer la lignée");if(n){G.family.name=n;save();renderAll();renderJournal();}}
  if(b.dataset.j==="reset"){const ok=await modal(`<p>Abandonner ta lignée et en fonder une nouvelle ? Elle restera inscrite dans les chroniques.</p>`,[{l:"Abandonner",cls:"danger",v:true},{l:"Annuler",v:false}]);
    if(ok){endLineage("abandonnée",hero());try{localStorage.removeItem(SAVE);localStorage.removeItem(OLD_SAVE);}catch(err){}showTab("world");newGame();}}
  if(b.dataset.j==="export"){
    const code="VALB1:"+btoa(unescape(encodeURIComponent(JSON.stringify({g:G,c:CHR}))));
    modal(`<h3>📤 Exporter</h3><p class="muted">Copie ce code et garde-le dans tes notes ou envoie-le-toi par mail. Il contient ta partie et les chroniques.</p><textarea id="exp" readonly>${code}</textarea>`,[{l:"Copier le code",cls:"primary",v:"copy"},{l:"Fermer",v:null}]).then(v=>{
      if(v==="copy"){const t=code;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Code copié !")).catch(()=>{toast("Copie impossible : sélectionne le texte à la main.");});}});
  }
  if(b.dataset.j==="import"){
    const v=await modal(`<h3>📥 Importer</h3><p class="muted">Colle ici un code exporté. Il remplacera ta partie actuelle et les chroniques de ce navigateur.</p><textarea id="imp" placeholder="VALB1:…"></textarea>`,[{l:"Importer",cls:"primary",v:"ok"},{l:"Annuler",v:null}]);
    if(v==="ok"){try{const raw=($("#imp").value||"").trim().replace(/^VALB1:/,"");const d=JSON.parse(decodeURIComponent(escape(atob(raw))));
        if(!d.g||!d.g.chars||!d.c)throw 0;CHR={...freshChr(),...d.c};saveChr();localStorage.setItem(SAVE,JSON.stringify(d.g));G=load();save();showTab("world");renderAll();toast("Partie importée !");checkProgress();}
      catch(err){toast("Ce code n’est pas valide.");}}
  }
  if(b.dataset.j==="wipe"){const ok=await modal(`<p>Effacer les chroniques de Valbrume ? Les lignées passées, les légendes, les tombes et l’état du monde seront oubliés. Ta partie en cours n’est pas touchée, mais les prochaines lignées repartiront d’un monde neuf.</p>`,[{l:"Effacer les chroniques",cls:"danger",v:true},{l:"Annuler",v:false}]);
    if(ok){CHR=freshChr();saveChr();renderAll();renderJournal();toast("Les chroniques ont été effacées.");}}
});
$("#cb-en").addEventListener("click",e=>{const b=e.target.closest(".en");if(!b||!C)return;const i=+b.dataset.i;if(C.enemies[i].hp>0){C.sel=i;updCombat();}});
$("#a-atk").addEventListener("click",()=>round("attack"));
$("#cb-skills").addEventListener("click",e=>{const b=e.target.closest("[data-sk]");if(b&&!b.disabled)round("skill",b.dataset.sk);});
$("#a-pot").addEventListener("click",()=>round("potion"));
$("#a-flee").addEventListener("click",async()=>{if(!C||C.busy)return;const ar=C.ctx.type==="arena";
  const ok=await modal(`<p>${ar?"Abandonner le combat ?":"Fuir le combat ? Tu perdras 10 % de ton or dans la panique."}</p>`,[{l:ar?"Abandonner":"Fuir",cls:"danger",v:true},{l:"Rester",v:false}]);if(ok)round("flee");});
$("#a-auto").addEventListener("change",e=>{G.auto=e.target.checked;save();if(G.auto&&C&&!C.busy)round("auto");});

(async()=>{
  const s=load();
  if(s&&s.heroId&&s.chars&&s.chars[s.heroId]){
    G=s;save();renderAll();
    if(G.ch<CHAPTERS.length&&(G.seenIntro||0)<G.ch){G.seenIntro=G.ch;await story(chap(G.ch).t,["Un nouveau chapitre s’ouvre pour ta lignée."].concat(txt(chap(G.ch).intro)));}
    checkProgress();
  }else newGame();
})();
</script>
</body>
</html>
