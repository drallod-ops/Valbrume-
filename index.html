<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Lignée de Valbrume</title>
<meta name="theme-color" content="#34446f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Valbrume">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dde1e4; --surface:#f1f2f0; --surface2:#e5e8ea; --ink:#1c2128; --muted:#59626c; --line:#b7bfc6;
  --accent:#9a6b06; --on-accent:#fff; --hp:#c0392b; --hero:#2f8f4e; --xp:#2c6fd1; --track:#cfd5da;
  --map:#c9d4bf; --path:#8d8670; --good:#2f8f4e; --bad:#c0392b; --warn:#b26a00;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161c; --surface:#1c222a; --surface2:#242b35; --ink:#ebe6d9; --muted:#9aa3ad; --line:#333c48;
    --accent:#e2a93b; --on-accent:#1a1308; --hp:#e2584a; --hero:#4cbf72; --xp:#5c9df2; --track:#2b333e;
    --map:#1d2a22; --path:#7d7458; --good:#5fd08a; --bad:#ef6b5c; --warn:#e8a03a; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1c222a; --surface2:#242b35; --ink:#ebe6d9; --muted:#9aa3ad; --line:#333c48;
  --accent:#e2a93b; --on-accent:#1a1308; --hp:#e2584a; --hero:#4cbf72; --xp:#5c9df2; --track:#2b333e;
  --map:#1d2a22; --path:#7d7458; --good:#5fd08a; --bad:#ef6b5c; --warn:#e8a03a; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Alegreya",Georgia,"Times New Roman",serif;font-size:17px;line-height:1.45;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
h1,h2,h3,.sc{font-family:"Alegreya SC","Alegreya",Georgia,serif;font-weight:700;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.node:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.px{display:block;flex:none}
.wrap{max-width:540px;margin:0 auto;width:100%;padding:0 14px}
.muted{color:var(--muted)} .pos{color:var(--good)} .neg{color:var(--bad)} .warn{color:var(--warn)}

.top{padding:8px 0}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.who{display:flex;gap:8px;align-items:center;min-width:0}
.top h1{font-size:1.15rem;line-height:1.15}
.sub{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res{display:flex;gap:10px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.res small{font-weight:600;opacity:.8}
#map .lj{font-size:10px;font-weight:700;fill:var(--ink);opacity:.7;paint-order:stroke;stroke:var(--map);stroke-width:3px}
.cal-steps{margin:6px 0 0;padding:0;list-style:none;font-size:.85rem}
.cal-steps li{padding:2px 0}
.cal-steps li.past{opacity:.55}
.cal-steps li.now{font-weight:700}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tab{display:none;padding:4px 0 24px}
.tab.active{display:block}
h2{font-size:1.15rem;margin:18px 0 8px}

.goal{display:block;width:100%;text-align:left;border:1px solid var(--accent);border-radius:12px;background:var(--surface);padding:9px 12px;margin-bottom:10px;font-size:.95rem}
.goal b{font-family:"Alegreya SC",Georgia,serif;color:var(--accent)}

.mapbox{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  background:radial-gradient(ellipse at 20% 85%,rgba(120,160,80,.35),transparent 55%),radial-gradient(ellipse at 85% 20%,rgba(140,70,40,.3),transparent 50%),var(--map)}
#map{display:block;width:100%;height:auto}
#map .path{stroke:var(--path);stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round}
#map .path.route{stroke:var(--accent);stroke-width:4;stroke-dasharray:none;opacity:.85}
#map .node{cursor:pointer}
#map .node .ring{fill:rgba(255,255,255,.08);stroke:transparent;stroke-width:3}
#map .node.cur .ring{stroke:var(--accent);fill:rgba(226,169,59,.18)}
#map .node.sel .ring{stroke:var(--ink);stroke-dasharray:4 3}
#map .nl{font-family:"Alegreya SC",Georgia,serif;font-size:12px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--map);stroke-width:4px}
#map .mk{font-size:14px}
#map .qd{fill:var(--accent);stroke:var(--map);stroke-width:2}
#map .qt{font-family:"Alegreya SC",Georgia,serif;font-size:11px;font-weight:800;fill:var(--on-accent)}
.tbar{display:flex;gap:10px;align-items:center;border:1px solid var(--ink);border-radius:12px;background:var(--surface);padding:8px 10px;margin-top:8px}
.tbar[hidden]{display:none}
.tbar .tt{flex:1;font-size:.92rem;line-height:1.25}

.strip{display:flex;gap:8px;margin:10px 0;overflow-x:auto}
.chip{flex:1;min-width:104px;display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:5px 7px;font-size:.8rem}
.chip .cn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.loc{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px}
.loc-h{display:flex;gap:12px;align-items:center}
.loc-h h2{margin:0;font-size:1.3rem}
.loc p{margin:8px 0 12px;color:var(--muted)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .wide{grid-column:1/-1}
.npcs{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.npc{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:6px 10px}
.npc .nm{font-weight:700;line-height:1.2}
.npc .sb{font-size:.8rem;color:var(--muted)}
.npc .q{margin-left:auto;font-family:"Alegreya SC",Georgia,serif;font-size:.8rem;font-weight:800;color:var(--accent);white-space:nowrap}
.champ{display:flex;gap:10px;align-items:center;border:1px dashed var(--warn);border-radius:12px;padding:6px 10px;margin-top:8px}
.champ .grow{flex:1;min-width:0}
.trait{display:inline-block;font-size:.72rem;border-radius:6px;padding:1px 7px;margin:5px 4px 0 0;background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);font-weight:700}
.trait.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.trait.rare{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.bld{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px;margin-bottom:8px}
.bld .ic{font-size:26px;line-height:1.2}
.bld .grow{flex:1;min-width:0}
.stars{color:var(--accent);letter-spacing:2px}
.panel textarea{width:100%;min-height:110px;font:inherit;font-size:.78rem;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);word-break:break-all}
.champ.legend{border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.champ .nm{font-weight:700}
.champ .sb{font-size:.8rem;color:var(--muted)}

.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hero);transition:width .2s}
.bar.en i{background:var(--hp)} .bar.xp i{background:var(--xp)} .bar.gold i{background:var(--accent)}

.btn{position:relative;font-family:"Alegreya SC",Georgia,serif;font-weight:700;font-size:1rem;padding:11px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);min-height:46px;line-height:1.2}
.btn:disabled{opacity:.42;cursor:default}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.small{min-height:38px;padding:7px 10px;font-size:.9rem}
.btn small{font-family:"Alegreya",Georgia,serif;font-weight:400;font-size:.8rem}

.card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px;margin-bottom:10px}
.card-h{display:flex;gap:12px;align-items:center}
.card-h .nm{font-weight:700;font-size:1.05rem;line-height:1.2}
.card-h .sb{font-size:.85rem;color:var(--muted)}
.stats-line{display:flex;gap:14px;font-size:.88rem;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.pc{font-size:.85rem;margin-top:6px}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btns .btn{flex:1}
.tagline{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;color:var(--muted);vertical-align:middle;font-weight:400}

.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.steps li .m{width:22px;text-align:center;flex:none}
.steps li.done{color:var(--muted);text-decoration:line-through}
.steps li.cur{font-weight:700}
.steps li.fut{color:var(--muted)}
.story p{margin:.5em 0}
.hist{list-style:none;padding:0;margin:0}
.hist li{padding:6px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.trophies{display:flex;flex-wrap:wrap;gap:8px}
.trophy{width:54px;text-align:center;font-size:.65rem;line-height:1.1;color:var(--muted)}
.trophy .px{margin:0 auto 2px}
.trophy.no .px{filter:brightness(0);opacity:.25}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface)}
.tabs button{background:none;border:0;padding:8px 2px 10px;font-family:"Alegreya SC",Georgia,serif;font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;position:relative}
.tabs button span{font-size:1.35rem;line-height:1.2}
.tabs button.active{color:var(--ink)}
.tabs button.active::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* Combat */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:15;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.overlay[hidden]{display:none}
.cb{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.cb .wrap{flex:1;display:flex;flex-direction:column;padding-top:10px;padding-bottom:12px}
.cb-top{text-align:center;color:var(--muted);font-size:.9rem;font-family:"Alegreya SC",Georgia,serif}
.scene{position:relative;border-radius:16px;border:1px solid var(--line);padding:14px 6px 12px;margin:6px 0;overflow:hidden}
.scene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 8px,transparent 8px 16px);pointer-events:none}
.enemies{position:relative;z-index:1;display:flex;gap:4px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.en{position:relative;flex:1 1 0;min-width:90px;max-width:160px;text-align:center;border:0;background:none;padding:4px 2px}
.en .px{margin:0 auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.en .lab{display:inline-block;margin-top:4px;background:var(--surface);border:2px solid transparent;border-radius:8px;padding:2px 6px;max-width:100%}
.en.sel .lab{border-color:var(--accent)}
.en.ko{opacity:.25}
.en .enn{font-weight:700;font-size:.82rem;line-height:1.15}
.en .tg{font-size:.68rem;color:var(--warn);line-height:1.2}
.en .bar{margin-top:3px;height:6px}
.cb-log{list-style:none;margin:6px 0;padding:0;font-size:.88rem;color:var(--muted);min-height:84px}
.cb-log li:first-child{color:var(--ink)}
.allies{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.al{position:relative;display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:5px 10px}
.al.ko{opacity:.4}
.al .aln{font-weight:700;font-size:.92rem;display:flex;justify-content:space-between;gap:6px}
.al .st{font-weight:400;font-size:.78rem;color:var(--muted)}
.hp-txt{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cb-acts{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:8px}
.cb-skills{display:grid;gap:6px;margin-top:8px}
.skb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 3px;border-radius:12px;border:1px solid var(--accent);background:var(--surface);color:var(--ink);min-height:58px;line-height:1.1;font-family:"Alegreya SC",Georgia,serif;font-weight:700;font-size:.74rem;text-align:center}
.skb .ic{font-size:1.35rem;line-height:1}
.skb .cd{position:absolute;top:3px;right:5px;font-size:.72rem;color:var(--muted);font-family:"Alegreya",Georgia,serif}
.skb:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.sks{margin-top:8px}
.sks .sk{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line);font-size:.92rem;line-height:1.25}
.sks .sk .ic{font-size:1.3rem;width:28px;text-align:center;flex:none}
.sks .sk.lock{opacity:.55}
.en .est{font-size:.68rem;color:var(--xp);font-weight:700;line-height:1.2}
.tip{border-radius:10px;background:color-mix(in srgb,var(--xp) 12%,transparent);padding:7px 10px;margin-top:10px;font-size:.92rem}
.newsk{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.newsk .ic{font-size:2.4rem;line-height:1}
.carnet{list-style:none;padding:0;margin:8px 0 0}
.carnet li{padding:7px 0;border-top:1px solid var(--line);line-height:1.3}
.carnet .cd{display:block;font-size:.78rem;color:var(--muted)}
.bondl{font-size:.82rem;color:var(--muted);margin-top:6px}
.bar.bond i{background:#d6578a}
.btn.pick{text-align:left;font-family:"Alegreya",Georgia,serif;font-weight:400;padding:10px 12px;background:var(--bg)}
.btn.pick .nm{font-family:"Alegreya SC",Georgia,serif;font-weight:700;font-size:1.08rem}
.btn.pick .jb{color:var(--muted);font-size:.85rem}
.btn.pick .tl{display:block;font-size:.88rem;margin-top:3px;line-height:1.3}
.auto{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;color:var(--muted);font-size:.9rem}
.auto input{width:20px;height:20px;accent-color:var(--accent)}
.fl{position:absolute;left:50%;top:22%;font-family:"Alegreya SC",Georgia,serif;font-weight:800;font-size:1.35rem;pointer-events:none;animation:up .9s ease-out forwards;white-space:nowrap;color:#fff;text-shadow:0 2px 0 #000,0 0 4px #000;z-index:3}
.fl.d{color:#ff8a7a} .fl.h{color:#7dffa6} .fl.s{color:#ffd84a;font-size:1.7rem}
@keyframes up{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-38px)}}
.hit{animation:hit .3s}
@keyframes hit{20%{transform:translateX(-5px)}50%{transform:translateX(5px);filter:brightness(2)}80%{transform:translateX(-3px)}}
.lunge{animation:lunge .3s}
@keyframes lunge{50%{transform:translateY(10px) scale(1.08)}}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:25}
.sheet[hidden]{display:none}
.panel{background:var(--surface);width:100%;max-width:540px;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow-y:auto;animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(30px);opacity:.6}}
.panel h3{font-size:1.3rem;margin-bottom:6px}
.panel .mbtns{display:grid;gap:8px;margin-top:16px}
.panel input[type=text]{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:4px 0 10px}
.panel label.f{font-weight:700;font-size:.9rem}
.cls-opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:8px 10px;margin-bottom:8px}
.cls-opt.on{border-color:var(--accent)}
.cls-opt .nm{font-weight:700}
.cls-opt .rl{font-size:.8rem;color:var(--muted);margin-left:6px}
.cls-opt .pc{margin-top:2px}
.foe{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.foe .tg{font-size:.8rem;color:var(--warn)}
.diff{font-family:"Alegreya SC",Georgia,serif;font-size:1.1rem;margin-top:10px}
.gauge{margin-top:12px}
.gauge .gl{display:flex;justify-content:space-between;align-items:baseline;font-family:"Alegreya SC",Georgia,serif;font-size:1.05rem}
.gauge .gl span:last-child{font-family:"Alegreya",Georgia,serif;font-size:.92rem;color:var(--muted)}
.gauge .gb{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:5px}
.gauge .gb i{display:block;height:100%;border-radius:6px;background:#c9a227;transition:width .6s}
.gauge .gb i.pos{background:#3f9a5c}.gauge .gb i.warn{background:#d08a2a}.gauge .gb i.neg{background:#c0443a}
.skb{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.skb:not(:disabled){animation:skp 1.8s ease-in-out infinite}
@keyframes skp{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 0%,transparent)}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 35%,transparent)}}
.btn.warnb:not(:disabled){border-color:#c0443a;color:#c0443a;animation:wb 1s ease-in-out infinite}
@keyframes wb{50%{background:color-mix(in srgb,#c0443a 14%,transparent)}}
.en .ehp{font-size:.66rem;color:var(--muted);line-height:1.1}
.fl.c{font-size:1.5rem;color:#f0b020;font-weight:800;text-shadow:0 1px 0 #000}
.fl.m{font-size:.9rem;color:var(--muted)}
.scene.shake{animation:shk .28s}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tabs button.dot::after{content:"";position:absolute;top:6px;left:calc(50% + 10px);width:9px;height:9px;border-radius:50%;background:#d6453a;box-shadow:0 0 0 2px var(--surface)}
.btn{position:relative}
.newb{position:absolute;top:-7px;right:-4px;background:#d6453a;color:#fff;font-family:"Alegreya",Georgia,serif;font-size:.62rem;font-weight:700;padding:1px 6px;border-radius:8px;letter-spacing:.02em}
.path.goalr{stroke:var(--accent);stroke-width:3;stroke-dasharray:3 6;opacity:.9}
.maplg{font-size:.72rem;color:var(--muted);text-align:center;margin:4px 0 2px}
.chip{cursor:pointer}
.bar.low i{background:#c0443a}
.chip{position:relative}
.title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--surface);overflow:hidden}
.title[hidden]{display:none}
.tscw{position:relative;flex:1 1 auto;min-height:250px;background:#26315a}
.tsc{position:absolute;inset:0;width:100%;height:100%}
.ttl{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 7vh);text-align:center;color:#fff4d6;line-height:1;text-shadow:0 3px 0 #2a2238,0 0 18px rgba(20,16,40,.6);pointer-events:none}
.ttl .t1{display:block;font-size:1.2rem;font-weight:700;letter-spacing:.06em}
.ttl .t2{display:block;font-size:clamp(2.6rem,13vw,3.6rem);font-weight:800;margin-top:4px}
.tm1{animation:tdrift 46s ease-in-out infinite alternate}.tm2{animation:tdrift 34s ease-in-out infinite alternate-reverse}
.tsmoke{animation:tsmoke 6s ease-in-out infinite;transform-origin:128px 110px}
@keyframes tdrift{from{transform:translateX(0)}to{transform:translateX(-150px)}}
@keyframes tsmoke{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:.85;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.tm1,.tm2,.tsmoke{animation:none}}

<script>
"use strict";
/* ===== Illustrations vectorielles ===== */
const OL="#2a2230";

}
function shield(o){
  const c=o.shieldColor||"#3f73dc";
  if(o.shield==="kite")return `<path d="M15 50 L45 50 L45 66 Q45 82 30 90 Q15 82 15 66 Z" fill="${c}" ${S}/><path d="M30 50 L30 89" stroke="${o.emblem||"#f0c03a"}" stroke-width="4"/><path d="M15 62 L45 62" stroke="${o.emblem||"#f0c03a"}" stroke-width="4"/><path d="M15 50 L45 50 L45 66 Q45 82 30 90 Q15 82 15 66 Z" fill="none" ${S}/>`;
  if(o.shield==="round")return `<circle cx="28" cy="66" r="15" fill="${c}" ${S}/><circle cx="28" cy="66" r="10" fill="none" stroke="${sh(c,-.3)}" stroke-width="2"/><circle cx="28" cy="66" r="4" fill="#c0c8d0" ${S}/>`;
  return "";
}
function humanoid(o){
  const skin=o.skin||"#f1c19a",body=o.body||"#cf3d33",pants=o.pants||"#5a3818",boots=o.boots||"#3a2a20",hair=o.hair||"#6b3e1f";

  if(o.robe){const d="M37 49 Q50 45 63 49 L71 88 Q50 94 29 88 Z";s+=shapeShade(d,body,"M50 47 L63 49 L71 88 Q61 91 50 92 Z");

  if(!o.robe||o.belt)s+=`<rect x="34" y="${o.robe?66:66}" width="32" height="5" fill="${o.belt||"#4a3020"}" ${S}/><rect x="47" y="65" width="6" height="7" rx="1" fill="#e8b83a" ${S}/>`;

    if(o.skull){s+=`<ellipse cx="43.5" cy="34" rx="4.5" ry="5" fill="${OL}"/><ellipse cx="56.5" cy="34" rx="4.5" ry="5" fill="${OL}"/><circle cx="43.5" cy="34.5" r="1.7" fill="${o.glow||"#ff5a3c"}"/><circle cx="56.5" cy="34.5" r="1.7" fill="${o.glow||"#ff5a3c"}"/><path d="M48.5 40 L50 37.5 L51.5 40 Z" fill="${OL}"/><path d="M44 45 h12 M47 43.5 v3.5 M50 43.5 v3.5 M53 43.5 v3.5" stroke="${OL}" stroke-width="1.6"/>`;}
    else if(o.shadowFace){s+=`<circle cx="50" cy="35" r="13" fill="#15121c"/><ellipse cx="45" cy="36" rx="2.6" ry="1.6" fill="${o.glow||"#ff4a3a"}"/><ellipse cx="55" cy="36" rx="2.6" ry="1.6" fill="${o.glow||"#ff4a3a"}"/>`;}
    else{
      const e=o.eye||"#2a2230";

      if(o.angry)s+=`<path d="M39.5 29.5 L47 32 M60.5 29.5 L53 32" stroke="${OL}" stroke-width="2"/>`;
      s+=`<ellipse cx="39" cy="40.5" rx="3" ry="1.8" fill="#e05a5a" opacity=".25"/><ellipse cx="61" cy="40.5" rx="3" ry="1.8" fill="#e05a5a" opacity=".25"/>`;
      if(o.mask)s+=`<path d="M33 38 Q50 36 67 38 L65 48 Q50 52 35 48 Z" fill="${o.mask}" ${S}/>`;
      else if(!o.beard)s+=o.tusks?`<path d="M45 43 Q50 46 55 43" fill="none" stroke="${OL}" stroke-width="1.8"/><path d="M44 43 L45 37.5 L47.5 43 Z M56 43 L55 37.5 L52.5 43 Z" fill="#f2eee2" stroke="${OL}" stroke-width="1.2"/>`:`<path d="M47 42.5 Q50 44.5 53 42.5" fill="none" stroke="${OL}" stroke-width="1.8"/>`;

    if(o.hairStyle==="short"||o.hairStyle==="long")s+=`<path d="M32.5 33 Q31 14 50 14 Q69 14 67.5 33 Q63 23 56 24 Q51 27 46 23.5 Q38 23 32.5 33 Z" fill="${hair}" ${S}/>`;

  }

    s+=`<path d="M31 37 Q29 11 50 11 Q71 11 69 37 L64 41 L63.5 27 L36.5 27 L36 41 Z" fill="${hc}" ${S}/><path d="M38 17 Q44 13 50 13" stroke="#fff" stroke-width="2" opacity=".55" fill="none"/><rect x="48.4" y="26" width="3.2" height="13" rx="1" fill="${hc}" ${S}/>`;

}

async function checkProgress(){
  if(progressing||!hero())return;progressing=true;
  try{
    if(G.pending&&G.pending.length){const gen=G;await processPending();if(G!==gen||!hero())return;}
    if(G.phase==="campagne"&&G.jours<=0){const gen=G;await finCampagne();if(G!==gen||!hero())return;}
    while(G.ch<CHAPTERS.length){
      const s=curStep();if(!stepDone(s))break;
      toast("✔ "+s.t);

      G.step++;save();

        const c=chap(G.ch);await story(c.t,txt(c.outro));
        G.ch++;G.step=0;applyLocs();
        if(G.ch<CHAPTERS.length){G.seenIntro=G.ch;const n=chap(G.ch);await story(n.t,txt(n.intro));}

}

    for(const m of mercs())if(m.perk==="alchimiste"&&m.hired&&G.day>m.hired&&(G.day-m.hired)%5===0){G.potions++;toast(`🧪 ${m.name} a préparé une potion.`);}

}

/* Rencontres adaptatives : le niveau des ennemis suit le groupe.
   Tirage de la difficulté visée : facile 20 %, équilibré 60 %, difficile 17 %, mortel 3 %.
   Calibrage sur un joueur qui utilise ses compétences comme le mode automatique. */
const TIER_W=[[.2,.99],[.6,.95],[.17,.8],[.03,.5]];
function pickTarget(){let r=Math.random();for(const [w,t] of TIER_W)if((r-=w)<0)return t;return .76;}
function foes(pool,n,mod={},target){
  if(target===undefined)target=pickTarget();
  const H=hero().lvl,z=LOCS[G.loc]||{},lo=z.lv?z.lv[0]:1,hi=z.lv?z.lv[1]+2:99,base=Math.max(lo,Math.min(hi,H)),rt=[0,1,2,3][Math.min(G.ch,3)];
  /* Calibrage à mi-chemin entre la puissance réelle du groupe et un groupe de référence
     (niveau de la zone, équipement attendu au chapitre, sans honneur ni bonus) :
     l’équipement, le niveau, l’honneur et les compagnons comptent, sans tout écraser. */
  const party=partyChars().map((c,i)=>{const s=charStats({...c,injury:0}),r=charStats({refc:true,cls:c.cls,lvl:base,wT:rt,aT:rt}),m=k=>Math.round((s[k]+r[k])/2);
    return {id:"ref"+i,refHero:i===0,kind:"ref",cls:c.cls,lvl:c.lvl,spec:c.spec,traits:[],perk:c.perk,st:{hp:m("hp"),atk:m("atk"),def:m("def")},hp:99999};});
  const L=Math.max(1,base+(target>.95?-1:target>.8?0:target>.55?1:2));
  const tpls=Array.from({length:n},()=>pick(pool));
  const build=(k,m)=>tpls.slice(0,m).map((t,i)=>{const e=makeEnemy(t,Math.max(1,L-(m>2&&i===m-1?1:0)),mod);e.hp=Math.max(4,Math.round(e.hp*Math.pow(k,0.4)));e.atk=Math.max(1,Math.round(e.atk*Math.pow(k,1)));e.def=Math.round(e.def*Math.pow(k,.3));return e;});
  const p=(en,N=120)=>{let w=0;for(let i=0;i<N;i++)if(simBattle(en,party))w++;return w/N;};
  let m=n;while(m>1&&p(build(.35,m))<target)m--;
  let a=Math.log(.25),b=Math.log(12);
  for(let i=0;i<9;i++){const k=(a+b)/2;if(p(build(Math.exp(k),m),i<5?100:200)>=target)a=k;else b=k;}
  return build(Math.exp((a+b)/2),m);
}
function wildGroup(k){const L=LOCS[k],ps=partyChars().length;const n=Math.max(1,Math.min(ps+1,ri(L.size[0],L.size[1])));return foes(L.en,n);}

/* ---------- La Fosse : la corde (moteur pur, sans interface) ---------- */
const FT={
  fort:{n:"Démarre fort",ic:"🐎",d:"redoutable dans les premières passes, moins ensuite"},
  souffle:{n:"Second souffle",ic:"🫁",d:"plus dangereux quand il est mené"},
  epuise:{n:"S’épuise",ic:"🥵",d:"faiblit au fil des passes"},
  imprevu:{n:"Imprévisible",ic:"🎲",d:"coups d’éclat fréquents"},
  rancune:{n:"Rancunier",ic:"😤",d:"se venge juste après avoir perdu une passe"},
  regulier:{n:"Régulier",ic:"⚖️",d:"ni surprise ni coup d’éclat"}
};
const FK={f1:.09,f2:.05,s:.08,e1:.09,e2:.03,r:.08,ec:.12,eci:.26,ecr:.05,end:3,cap:7,margin:.9};
function fMod(tr,i,pos,lost){switch(tr){case"fort":return i<=3?FK.f1:-FK.f2;case"souffle":return pos<0?FK.s:0;case"epuise":return i>=5?-FK.e1:FK.e2;case"rancune":return lost?FK.r:0;}return 0;}
const fEc=tr=>tr==="imprevu"?FK.eci:tr==="regulier"?FK.ecr:FK.ec;
/* q : probabilité que A gagne la passe i ; pos du point de vue de A ; last : 1 si A a gagné la passe précédente, 2 si B, 0 sinon */
function fPass(A,B,i,pos,last,house){
  const base=A.f/(A.f+B.f);if(house)return Math.max(.08,Math.min(.92,base));
  return Math.max(.08,Math.min(.92,base+fMod(A.tr,i,pos,last===2)-fMod(B.tr,i,-pos,last===1)));
}
/* Probabilité exacte que A gagne depuis l’état (pos, passe i, dernier vainqueur). Itération de valeur sur 5×7×3 états. */
function fProb(A,B,pos0,i0,last0,house){

function veillee(ruin){
  const out=[],L=CHR.lineages,nm=L.slice(-2).map(x=>"des "+x.name).join(" et ");
  if(L.length)out.push(L.length>2?`Au coin du feu, on se souvient de ${L.length} lignées avant la tienne, et surtout ${nm}.`:`Au coin du feu, on parle encore ${nm}.`);
  const lg=CHR.legends.filter(l=>!l.slain),so=CHR.souls.filter(x=>!x.freed);
  if(lg.length){const l=lg[lg.length-1];out.push(`On murmure que ${l.n}, qui a mis fin à la lignée ${l.lineage}, rôde encore ${LOC_IN[l.loc]||"vers "+LOCS_BASE[l.loc].n}${lg.length>1?". Ce n’est pas la seule bête de légende dans la vallée":""}.`);}
  else if(so.length){const x=so[so.length-1];out.push(`Certains soirs, l’esprit de ${x.full} erre ${LOC_IN[x.loc]||"vers "+LOCS_BASE[x.loc].n}, sans trouver le repos.`);}
  if(ruin)out.push(ruin);
  return out;
}
async function newGame(){
  G={v:4,an:1,phase:"printemps",jours:CAMPAGNE,expecting:false,day:1,gold:30,potions:3,ch:0,step:0,seenIntro:0,flags:{},visited:{village:true},loc:"village",chars:{},heroId:null,party:[],choices:{},deeds:[],relics:[],prayed:{},variants:{},worldSnap:JSON.parse(JSON.stringify(CHR.world)),pending:[],partner:null,
     family:{name:"",gen:1,history:[]},news:[],mods:{},fest:{},visits:{},honor:0,quests:{},champs:{},tourney:{},married:false,nextBirth:0,nemesis:null,auto:false};
  let cls=null;
  await new Promise(res=>{
    $("#mpanel").innerHTML=`<h3>La Lignée de Valbrume</h3><p class="muted">Une histoire qui peut durer plusieurs générations. Si ton héros tombe, ses enfants poursuivront la quête… et la vengeance.</p>${CHR.lineages.length?`<p class="dlg">Les chroniques de Valbrume se souviennent de ${CHR.lineages.length} lignée${CHR.lineages.length>1?"s":""}. Le monde que tu vas découvrir porte la marque de leurs actes${CHR.legends.some(l=>!l.slain)?", et des légendes rôdent encore dans la vallée":""}.</p>`:""}
      <label class="f" for="fn">Nom de ta famille</label><input type="text" id="fn" maxlength="18" placeholder="Montclair">
      <label class="f" for="hn">Prénom de ton héros</label><input type="text" id="hn" maxlength="16" placeholder="Aldric">
      <label class="f">Classe</label>${clsOptions()}
      <div class="mbtns"><button class="btn primary" id="go" disabled>Commencer l’aventure</button></div>`;
    $("#modal").hidden=false;$("#modal").onclick=null;
    $("#mpanel").onclick=e=>{const o=e.target.closest(".cls-opt");
      if(o){cls=o.dataset.c;document.querySelectorAll(".cls-opt").forEach(x=>x.classList.toggle("on",x===o));$("#go").disabled=false;return;}
      if(e.target.id==="go"&&cls){$("#modal").hidden=true;res();}};
  });
  G.family.name=$("#fn").value.trim()||"Montclair";
  if(CHR.lineages.length&&CHR.rival){CHR.rival.gen++;const rg=Math.random()<.5?"m":"f";CHR.rival.heir=freshName(rg);CHR.rival.g=rg;saveChr();}
  const h=newChar($("#hn").value.trim()||"Aldric",cls,"hero");h.age=18;h.traits=[pick(GOOD_TRAITS)];h.hp=charStats(h).hp;G.chars[h.id]=h;G.heroId=h.id;mem(h,"Prend les armes pour défendre Valbrume.");
  if(CHR.lineages.length){const last=CHR.lineages[CHR.lineages.length-1];
    const v=await modal(`<h3>L’héritage des ${esc(last.name)}</h3><p>La lignée ${esc(last.name)} s’est éteinte, mais elle laisse quelque chose derrière elle. Que reçoit ta famille ?</p>`,
      [{l:"💰 Le coffre familial<br><small>+80 🪙 et 2 potions</small>",v:0},{l:"⚔️ L’arme de l’ancêtre<br><small>Une arme de fer dès le départ</small>",v:1},{l:"🌟 Le sang des anciens<br><small>Un second trait positif</small>",v:2}],{dismiss:false});
    if(v===0){G.gold+=80;G.potions+=2;mem(h,`Hérite du coffre de la lignée ${last.name}.`);}
    else if(v===1){h.wT=Math.max(h.wT,1);mem(h,`Hérite de l’arme de la lignée ${last.name}.`);}
    else{const t=pick(GOOD_TRAITS.filter(x=>!h.traits.includes(x)));h.traits.push(t);mem(h,`Porte dans le sang l’héritage de la lignée ${last.name} (${TRAITS[t].n}).`);}
    h.hp=charStats(h).hp;}
  save();renderAll();await story(chap(0).t,txt(chap(0).prologue));
  const tale=veillee(ruinVillage());
  if(tale.length)await story("Ce que l’on raconte à la veillée",tale);
  checkProgress();
}
function showTab(t){
  document.querySelectorAll(".tab").forEach(s=>s.classList.toggle("active",s.id==="tab-"+t));
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));
  if(t==="family")renderFamily();if(t==="journal"){G.newsSeenN=G.newsN||0;renderJournal();}$("main").scrollTop=0;if(G&&hero())badges();
}
function mapTap(k){
  if(traveling)return;
  if(k===G.loc){selLoc=null;renderMap();return;}
  if(selLoc===k){travel(k);return;}
  selLoc=k;renderMap();
}
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)showTab(b.dataset.tab);});
$("#goal").addEventListener("click",()=>showTab("journal"));
$("#map").addEventListener("click",e=>{const n=e.target.closest(".node");if(n)mapTap(n.dataset.loc);});
$("#map").addEventListener("keydown",e=>{if(e.key==="Enter"){const n=e.target.closest(".node");if(n)mapTap(n.dataset.loc);}});
$("#tbar").addEventListener("click",e=>{if(e.target.closest("#go-travel")&&selLoc)travel(selLoc);if(e.target.closest("#no-travel")){selLoc=null;renderMap();}});
$("#loc").addEventListener("click",e=>{if(traveling)return;const a=e.target.closest("[data-a]");if(a)return locAction(a.dataset.a);
  const n=e.target.closest("[data-npc]");if(n)return npcDialog(n.dataset.npc);const c=e.target.closest("[data-champ]");if(c)return champPreview(c.dataset.champ);
  const lg=e.target.closest("[data-legend]");if(lg)return legendPreview(lg.dataset.legend);const so=e.target.closest("[data-soul]");if(so)return soulPreview(so.dataset.soul);});
$("#family").addEventListener("click",async e=>{
  const b=e.target.closest("[data-f]");if(!b)return;const c=G.chars[b.dataset.id];if(!c)return;
  if(b.dataset.f==="party"){if(G.party.includes(c.id))G.party=G.party.filter(x=>x!==c.id);else if(G.party.length<2)G.party.push(c.id);}
  else if(b.dataset.f==="train"){const p=trainPrice(c);if(G.gold<p||c.lvl>=hero().lvl-1||c.trainDay===G.day)return;G.gold-=p;c.lvl++;c.xp=0;c.hp=charStats(c).hp;c.trainDay=G.day;noteSkills(c,c.lvl-1);toast(`${c.name} passe niveau ${c.lvl}.`);}
  else if(b.dataset.f==="time"){if(c.timeDay===G.day||c.cls)return;c.timeDay=G.day;const first=!(c.mem||[]).some(x=>x.time);const mo=pick(MOMENTS).replace("{h}",hero().name);
    if(first||Math.random()<.35){mem(c,mo);c.mem[c.mem.length-1].time=1;}toast(`💛 ${mo}`);if(Math.random()<.3){const t=revealTrait(c);if(t)setTimeout(()=>toast(`✨ ${t}`),1800);}}
  else if(b.dataset.f==="mem"){await carnet(c);return;}
  else if(b.dataset.f==="extend"){const p=mercPrice(c.lvl);if(G.gold<p)return;G.gold-=p;if(c.until>G.an)return;c.until=G.an+1;toast(`${c.name} restera aussi pour la prochaine campagne.`);}
  else if(b.dataset.f==="fire"){const ok=await modal(`<p>Congédier ${esc(c.name)} ? Tu ne le reverras plus.</p>`,[{l:"Congédier",cls:"danger",v:true},{l:"Annuler",v:false}]);if(!ok)return;G.party=G.party.filter(x=>x!==c.id);delete G.chars[c.id];}
  else if(b.dataset.f==="rename"){if(c.id!==G.heroId&&c.kind!=="child")return;const n=await askName(c.name,"Renommer "+c.name);if(!n)return;c.name=n;if(!(c.id===G.heroId&&G.married))c.g=genderOf(n);toast(`Désormais, on l’appelle ${n}.`);}
  else if(b.dataset.f==="retire"){await retire();return;}
  else if(b.dataset.f==="pot"){const m=charStats(c).hp;if(c.hp>=m||G.potions<=0)return;G.potions--;const v=Math.round(m*(bld("temple")>=2?.7:.5));c.hp=Math.min(m,c.hp+v);toast(`🧪 ${c.name} boit une potion : +${v} PV.`);}
  else if(b.dataset.f==="spec"){await chooseSpec(c);}
  else if(b.dataset.f==="cls"){const k=await chooseClass(`La voie de ${c.name}`,vocIntro(c));if(!k)return;c.cls=k;mem(c,`Choisit la voie du ${CLASSES[k].n.toLowerCase()}.`);c.hp=charStats(c).hp;toast(`${c.name} devient ${CLASSES[k].n.toLowerCase()}.`);}
  save();renderAll();renderFamily();await announceSkills();checkProgress();
});
$("#journal").addEventListener("click",async e=>{
  const b=e.target.closest("[data-j]");if(!b)return;
  if(b.dataset.j==="intro"&&G.ch<CHAPTERS.length)story(chap(G.ch).t,txt(chap(G.ch).intro));
  if(b.dataset.j==="famname"){const n=await askName(G.family.name,"Renommer la lignée");if(n){G.family.name=n;save();renderAll();renderJournal();}}
  if(b.dataset.j==="reset"){const ok=await modal(`<p>Abandonner ta lignée et en fonder une nouvelle ? Elle restera inscrite dans les chroniques.</p>`,[{l:"Abandonner",cls:"danger",v:true},{l:"Annuler",v:false}]);
    if(ok){endLineage("abandonnée",hero());try{localStorage.removeItem(SAVE);localStorage.removeItem(OLD_SAVE);}catch(err){}showTab("world");newGame();}}
  if(b.dataset.j==="export")saveExport();
  if(b.dataset.j==="import")saveImport();
  if(b.dataset.j==="title"){showTitle();return;}
  if(b.dataset.j==="wipe"){const ok=await modal(`<p>Effacer les chroniques de Valbrume ? Les lignées passées, les légendes, les tombes et l’état du monde seront oubliés. Ta partie en cours n’est pas touchée, mais les prochaines lignées repartiront d’un monde neuf.</p>`,[{l:"Effacer les chroniques",cls:"danger",v:true},{l:"Annuler",v:false}]);
    if(ok){CHR=freshChr();saveChr();renderAll();renderJournal();toast("Les chroniques ont été effacées.");}}
});
$("#strip").addEventListener("click",e=>{const b=e.target.closest("[data-pot]");if(!b||traveling)return;const c=G.chars[b.dataset.pot];if(!c)return;const m=charStats(c).hp;
  if(c.hp>=m)return toast(`${c.name} est en pleine forme.`);if(G.potions<=0)return toast("Plus de potion. Il y en a au village.");
  G.potions--;const v=Math.round(m*(bld("temple")>=2?.7:.5));c.hp=Math.min(m,c.hp+v);save();renderAll();toast(`🧪 ${c.name} boit une potion : +${v} PV.`);});
$("#cb-en").addEventListener("click",e=>{const b=e.target.closest(".en");if(!b||!C)return;const i=+b.dataset.i,en=C.enemies[i];if(en.hp<=0)return;
  if((C.sel===i||C.enemies.filter(x=>x.hp>0).length===1)&&en.tags.length)toast(`${en.n} : ${en.tags.map(t=>tagTxt(t).toLowerCase()).join(" · ")}`);C.sel=i;updCombat();});
let lpT=null,lpFired=false;
$("#cb-skills").addEventListener("pointerdown",e=>{const b=e.target.closest("[data-sk]");if(!b)return;lpFired=false;clearTimeout(lpT);lpT=setTimeout(()=>{lpFired=true;const id=b.dataset.sk,k=SKILLS[id],h=hero();toast(`${skIc(h,id)} ${skName(h,id)} : ${skDesc(h,id)} Recharge : ${k.cd} tours.`);},450);});
["pointerup","pointerleave","pointercancel"].forEach(ev=>$("#cb-skills").addEventListener(ev,()=>clearTimeout(lpT)));
$("#cb-skills").addEventListener("contextmenu",e=>e.preventDefault());
$("#a-atk").addEventListener("click",()=>round("attack"));
$("#cb-skills").addEventListener("click",e=>{if(lpFired){lpFired=false;return;}const b=e.target.closest("[data-sk]");if(b&&!b.disabled)round("skill",b.dataset.sk);});
$("#a-pot").addEventListener("click",()=>round("potion"));
$("#a-flee").addEventListener("click",async()=>{if(!C||C.busy)return;const ar=C.ctx.type==="arena";
  const ok=await modal(`<p>${ar?"Abandonner le combat ?":"Fuir le combat ? Tu perdras 10 % de ton or dans la panique."}</p>`,[{l:ar?"Abandonner":"Fuir",cls:"danger",v:true},{l:"Rester",v:false}]);if(ok)round("flee");});
$("#a-auto").addEventListener("change",e=>{G.auto=e.target.checked;save();if(G.auto&&C&&!C.busy)round("auto");});

async function resumeGame(s){
  if(s&&s.heroId&&s.chars&&s.chars[s.heroId]){
    G=s;save();renderAll();
    if(G.ch<CHAPTERS.length&&(G.seenIntro||0)<G.ch){G.seenIntro=G.ch;await story(chap(G.ch).t,["Un nouveau chapitre s’ouvre pour ta lignée."].concat(txt(chap(G.ch).intro)));}
    checkProgress();
  }else newGame();
}
showTitle();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
